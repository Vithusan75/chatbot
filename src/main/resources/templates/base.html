<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Chatbot IA</title>
    <link rel="stylesheet" th:href="@{/vendor/css/bootstrap.min.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-auto text-center py-5">
    <div th:replace="${content}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/vendor/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
