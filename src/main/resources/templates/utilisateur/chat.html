<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Assistant IA</title>
</head>

<body>

<main class="chat-page flex-grow-1 d-flex flex-column">

    <section class="flex-grow-1 overflow-auto p-3 p-md-4 d-flex flex-column">

        <div th:if="${conversation == null}"
             class="welcome-card text-center mx-auto my-auto px-4 py-4">
            <h2 class="fw-bold mb-2">Comment puis-je vous aider ?</h2>
            <p class="text-muted mb-0">
                Choisissez un modèle IA et posez votre question.
            </p>
        </div>

        <div class="chat-messages-container w-100 mx-auto" th:if="${messages != null and !#lists.isEmpty(messages)}">
            <div th:each="message : ${messages}"
                 class="mb-4">

                <span class="badge bg-dark mb-1" th:text="${message.typeMessage}"></span>

                <div class="message message-content js-md"
                     th:text="${message.contenu}">
                </div>

            </div>
        </div>

    </section>

    <div class="chat-composer-wrapper px-3 py-3">
        <div class="chat-composer-box mx-auto p-3 rounded-4 shadow">

            <form id="formChat"
                  th:if="${conversation == null}"
                  th:action="@{/conversations}"
                  method="post">

                <div class="d-flex flex-row align-items-end gap-2">

                    <div class="model-select-wrapper flex-shrink-0">
                        <select name="idModele"
                                class="form-select model-select"
                                required>
                            <option value="" disabled selected>
                                Choisir un modèle IA
                            </option>
                            <option th:each="modele : ${modeles}"
                                    th:value="${modele.id}"
                                    th:text="${modele.nom}">
                            </option>
                        </select>
                    </div>

                    <div class="flex-grow-1 min-w-0">
                        <textarea name="prompt"
                                  class="form-control w-100"
                                  rows="2"
                                  placeholder="Posez votre question..."
                                  required></textarea>
                    </div>

                    <div class="send-button-wrapper flex-shrink-0">
                        <button class="btn btn-primary px-4"
                                type="submit">
                            Envoyer
                        </button>
                    </div>

                </div>
            </form>

            <form th:if="${conversation != null}"
                  th:action="@{/conversations/{id}/messages(id=${conversation.id})}"
                  method="post">

                <div class="d-flex flex-row align-items-end gap-2">

                    <div class="model-current d-flex align-items-center gap-2 flex-shrink-0">
                        <img th:src="${#strings.toLowerCase(conversation.modeleIA.fourniseurIA.nom) == 'mistral'}
                                     ? @{/img/mistral.png}
                                     : @{/img/gemini.jpeg}"
                             th:alt="${conversation.modeleIA.fourniseurIA.nom}"
                             width="30"
                             height="30"
                             class="rounded-circle">

                        <strong th:text="${conversation.modeleIA.nom}">
                            Modèle IA
                        </strong>
                    </div>

                    <div class="flex-grow-1 min-w-0">
                        <textarea name="prompt"
                                  class="form-control w-100"
                                  rows="2"
                                  placeholder="Écrivez votre message..."
                                  required></textarea>
                    </div>

                    <div class="send-button-wrapper flex-shrink-0">
                        <button class="btn btn-primary px-4"
                                type="submit">
                            Envoyer
                        </button>
                    </div>

                </div>

            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const blocs = document.querySelectorAll(".js-md");
            for (let i = 0; i < blocs.length; i++) {
                const bloc = blocs[i];
                const texte = bloc.textContent;
                bloc.innerHTML = DOMPurify.sanitize(marked.parse(texte));
            }
        });
    </script>

</main>
</body>
</html>
